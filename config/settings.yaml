project:
  name: "Causal Pricing Intelligence & Optimization Engine"
  seed: 42
  default_n_rows: 50000
  available_sizes: [10000, 50000, 100000, 500000]

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  synthetic_dir: "data/synthetic"
  reports_dir: "reports"
  figures_dir: "reports/figures"
  experiments_dir: "reports/experiments"
  artifacts_dir: "artifacts"

simulation:
  start_date: "2024-01-01"
  n_days: 365
  n_customers: 4000
  n_products: 120
  confounding_strength: 1.0
  did_start_day: 180
  did_price_drop: 0.12
  promo_discount_depth: 0.15
  instrument_strength: 0.32
  treatment_assignment: "observational" # observational | randomized | skewed

preprocessing:
  outlier_quantile_low: 0.001
  outlier_quantile_high: 0.999
  min_price: 1.0
  min_quantity: 0.0

uplift:
  base_learner: "gradient_boosting" # random_forest | gradient_boosting | xgboost | ridge
  n_estimators: 120
  max_depth: 4
  learning_rate: 0.08
  propensity_clip: 0.05

optimization:
  candidate_price_changes: [-0.10, -0.05, 0.0, 0.05, 0.10]
  constraints:
    min_margin_pct: 0.08
    max_discount: 0.35
    min_price: 5.0
    max_price: 2000.0
    max_price_change_pct: 0.10
    min_seller_availability: 0.25
    max_treatment_coverage: 1.0

backtest:
  train_fraction: 0.75
  bootstrap_iterations: 100
